[package]
name = "earthscope"
version = "0.1.0"
description = "EarthScope desktop application"
authors = ["EarthScope contributors"]
edition = "2021"
rust-version = "1.77.2"
default-run = "earthscope"

[lib]
name = "earthscope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
